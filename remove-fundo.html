<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rede Líderes — Remove Fundo</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    if (!sessionStorage.getItem('unlocked')) {
      window.location.replace('/');
    }
  </script>

  <style>
    @font-face {
      font-family: 'Neue Machina';
      src: url('/fonts/NeueMachina-Light.otf') format('opentype');
      font-weight: 300; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Neue Machina';
      src: url('/fonts/NeueMachina-Regular.otf') format('opentype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Neue Machina';
      src: url('/fonts/NeueMachina-Ultrabold.otf') format('opentype');
      font-weight: 800; font-style: normal; font-display: swap;
    }

    :root {
      --teal:   #41c1c2;
      --bg:     #080808;
      --card:   #0f0f0f;
      --border: #1c1c1c;
      --muted:  #555;
      --font:   'Neue Machina', 'Helvetica Neue', Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg); color: #fff;
      font-family: var(--font); min-height: 100vh;
      padding: 96px 20px 80px;
    }

    .wrap { max-width: 800px; margin: 0 auto; }

    /* ─── Header ─── */
    header { text-align: center; margin-bottom: 44px; }
    .header-rule { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
    .header-rule span { flex: 1; height: 1px; max-width: 60px; background: linear-gradient(to right, transparent, var(--teal)); }
    .header-rule span:last-child { background: linear-gradient(to left, transparent, var(--teal)); }
    h1 { font-size: 20px; font-weight: 800; letter-spacing: 5px; text-transform: uppercase; }
    header p { font-size: 12px; color: var(--muted); letter-spacing: 1px; margin-top: 6px; }
    .back-link {
      display: inline-block; margin-bottom: 28px;
      font-size: 11px; color: var(--muted); letter-spacing: 1px;
      text-decoration: none; transition: color .2s;
    }
    .back-link:hover { color: var(--teal); }

    /* ─── Card ─── */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }

    label.field-label {
      display: block; font-size: 10px; font-weight: 700;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 9px;
    }

    /* ─── Upload zone ─── */
    .upload-zone {
      position: relative; border: 1px dashed var(--border);
      border-radius: 8px; padding: 32px 16px; text-align: center;
      cursor: pointer; transition: border-color .2s, background .2s; overflow: hidden;
      margin-bottom: 24px;
    }
    .upload-zone:hover { border-color: rgba(65,193,194,.4); background: rgba(65,193,194,.03); }
    .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .upload-idle .arrow { font-size: 28px; color: var(--teal); margin-bottom: 8px; }
    .upload-idle p { font-size: 13px; color: var(--muted); }
    .upload-idle strong { color: var(--teal); }
    .upload-idle .hint { font-size: 11px; color: var(--muted); margin-top: 6px; opacity: .6; }

    /* ─── Batch grid ─── */
    .batch-grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .batch-grid.visible { display: grid; }

    .img-card {
      background: #0a0a0a; border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
      display: flex; flex-direction: column;
      transition: border-color .2s;
    }
    .img-card.done   { border-color: rgba(65,193,194,.35); }
    .img-card.error  { border-color: rgba(255,107,107,.35); }
    .img-card.active { border-color: rgba(65,193,194,.6); }

    .img-card-thumb {
      aspect-ratio: 1/1;
      background: repeating-conic-gradient(#1a1a1a 0% 25%, #111 0% 50%) 0 0 / 14px 14px;
      overflow: hidden; position: relative;
    }
    .img-card-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .img-card-thumb .card-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.55); opacity: 0; transition: opacity .2s;
    }
    .img-card.active .card-overlay  { opacity: 1; }

    .card-spinner {
      width: 22px; height: 22px;
      border: 2px solid rgba(65,193,194,.25); border-top-color: var(--teal);
      border-radius: 50%; animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .img-card-info {
      padding: 8px 10px; flex: 1;
      display: flex; flex-direction: column; gap: 6px;
    }
    .img-card-name {
      font-size: 10px; color: #aaa; letter-spacing: .5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .img-card-status {
      font-size: 10px; letter-spacing: .5px; color: var(--muted);
    }
    .img-card.active .img-card-status  { color: var(--teal); }
    .img-card.done   .img-card-status  { color: #6ee06e; }
    .img-card.error  .img-card-status  { color: #ff6b6b; }

    .btn-card-dl {
      display: none; width: 100%; background: transparent;
      border: none; border-top: 1px solid var(--border);
      color: var(--teal); font-family: var(--font);
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; padding: 8px;
      cursor: pointer; transition: background .2s, color .2s;
    }
    .btn-card-dl:hover { background: rgba(65,193,194,.08); }
    .img-card.done .btn-card-dl { display: block; }

    /* ─── Actions ─── */
    .actions { display: flex; flex-direction: column; gap: 12px; }

    .btn-primary {
      width: 100%; background: var(--teal); color: #000; border: none;
      border-radius: 8px; padding: 15px; font-family: var(--font);
      font-size: 11px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase;
      cursor: pointer; transition: opacity .2s, transform .1s;
    }
    .btn-primary:hover:not(:disabled) { opacity: .88; }
    .btn-primary:active:not(:disabled) { transform: scale(.99); }
    .btn-primary:disabled { opacity: .28; cursor: not-allowed; }

    .btn-outline {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; background: transparent;
      border: 1px solid var(--teal); color: var(--teal); border-radius: 8px; padding: 13px;
      font-family: var(--font); font-size: 11px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase; cursor: pointer; transition: all .2s;
    }
    .btn-outline:hover:not(:disabled) { background: var(--teal); color: #000; }
    .btn-outline:disabled { opacity: .28; cursor: not-allowed; pointer-events: none; }

    .btn-ghost {
      display: block; width: 100%; background: transparent; border: none;
      color: var(--muted); font-family: var(--font); font-size: 11px;
      letter-spacing: 1px; text-align: center; cursor: pointer;
      padding: 10px; transition: color .2s;
    }
    .btn-ghost:hover { color: #fff; }

    /* ─── Progress bar ─── */
    .progress-wrap {
      display: none; margin-bottom: 4px;
    }
    .progress-wrap.visible { display: block; }
    .progress-bar-bg {
      height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: var(--teal); border-radius: 2px;
      transition: width .4s ease; width: 0%;
    }
    .progress-label {
      font-size: 10px; color: var(--muted); letter-spacing: 1px;
      margin-bottom: 6px; display: flex; justify-content: space-between;
    }

    /* ─── Status ─── */
    .status-bar { display: flex; align-items: center; gap: 10px; min-height: 28px; margin-top: 16px; }
    .spinner {
      display: none; flex-shrink: 0; width: 15px; height: 15px;
      border: 2px solid rgba(65,193,194,.2); border-top-color: var(--teal);
      border-radius: 50%; animation: spin .75s linear infinite;
    }
    .status-msg { font-size: 12px; color: var(--teal); letter-spacing: .5px; }
    .status-msg.err { color: #ff6b6b; }

    /* ─── Tool Nav ─── */
    .tool-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
      background: rgba(8,8,8,.88); backdrop-filter: blur(10px);
      border-bottom: 1px solid #1c1c1c; padding: 10px 16px;
    }
    .tool-nav a {
      font-family: 'Neue Machina', sans-serif;
      font-size: 11px; font-weight: 800; letter-spacing: 2.5px;
      text-transform: uppercase; text-decoration: none;
      color: #555; padding: 7px 18px; border-radius: 8px;
      border: 1px solid transparent; transition: color .2s, border-color .2s, background .2s;
    }
    .tool-nav a:hover { color: #fff; }
    .tool-nav a.active { color: #41c1c2; border-color: rgba(65,193,194,.35); background: rgba(65,193,194,.07); }
  </style>
</head>
<body>

  <nav class="tool-nav">
    <a href="/minibio.html">✨ Mini Bio</a>
    <a href="/mudanca-cargo.html">🏆 Mudança de Cargo</a>
    <a href="/carrossel-artigo.html">📰 Carrossel de Artigo</a>
    <a href="/seletor-prompts.html">🎨 Seletor de Prompts</a>
    <a class="active" href="/remove-fundo.html">✂️ Remove Fundo</a>
  </nav>

  <div class="wrap">

    <a class="back-link" href="/app.html">← Voltar ao hub</a>

    <header>
      <div class="header-rule">
        <span></span>
        <h1>Remove&nbsp;Fundo</h1>
        <span></span>
      </div>
      <p>Envie uma ou várias fotos e remova o fundo automaticamente via Remove.bg</p>
    </header>

    <div class="card">

      <label class="field-label">Fotos</label>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="photoFile" accept="image/*" multiple />
        <div class="upload-idle">
          <div class="arrow">↑</div>
          <p><strong>Escolher fotos</strong>&nbsp;ou arrastar aqui</p>
          <p class="hint">Selecione uma ou várias imagens de uma vez</p>
        </div>
      </div>

      <!-- Grid de lote -->
      <div class="batch-grid" id="batchGrid"></div>

      <!-- Barra de progresso do lote -->
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-label">
          <span id="progressText">Processando...</span>
          <span id="progressCount">0 / 0</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" id="btnRemove" disabled>
          ✂️ &nbsp; Remover Fundo
        </button>

        <button class="btn-outline" id="btnDownloadAll" disabled>
          ↓ &nbsp; Baixar Todos (.zip)
        </button>

        <button class="btn-ghost" id="btnReset" style="display:none">
          Usar outras fotos
        </button>
      </div>

      <div class="status-bar">
        <div class="spinner" id="spinner"></div>
        <span class="status-msg" id="statusMsg"></span>
      </div>

    </div>
  </div>

<script>
/* ── State ── */
let queue = [];        // { file, originalDataUrl, resultDataUrl, cardEl, statusEl, thumbEl, overlayEl }
let isRunning = false;

const photoFile     = document.getElementById('photoFile');
const btnRemove     = document.getElementById('btnRemove');
const btnDownloadAll= document.getElementById('btnDownloadAll');
const btnReset      = document.getElementById('btnReset');
const batchGrid     = document.getElementById('batchGrid');
const uploadZone    = document.getElementById('uploadZone');
const progressWrap  = document.getElementById('progressWrap');
const progressFill  = document.getElementById('progressFill');
const progressText  = document.getElementById('progressText');
const progressCount = document.getElementById('progressCount');

/* ── File input ── */
photoFile.addEventListener('change', function () {
  const files = Array.from(this.files);
  if (!files.length) return;
  buildQueue(files);
});

function buildQueue(files) {
  queue = [];
  batchGrid.innerHTML = '';
  batchGrid.classList.add('visible');
  uploadZone.style.display = 'none';
  btnReset.style.display = 'block';
  btnDownloadAll.disabled = true;
  progressWrap.classList.remove('visible');
  setStatus('');

  let loaded = 0;
  files.forEach(file => {
    const entry = { file, originalDataUrl: null, resultDataUrl: null };
    entry.cardEl = createCard(entry, file.name);
    queue.push(entry);

    const reader = new FileReader();
    reader.onload = e => {
      entry.originalDataUrl = e.target.result;
      entry.thumbEl.src = e.target.result;
      loaded++;
      if (loaded === files.length) btnRemove.disabled = false;
    };
    reader.readAsDataURL(file);
  });
}

function createCard(entry, filename) {
  const card = document.createElement('div');
  card.className = 'img-card';

  const thumbWrap = document.createElement('div');
  thumbWrap.className = 'img-card-thumb';

  const img = document.createElement('img');
  img.alt = filename;
  entry.thumbEl = img;

  const overlay = document.createElement('div');
  overlay.className = 'card-overlay';
  const spin = document.createElement('div');
  spin.className = 'card-spinner';
  overlay.appendChild(spin);
  entry.overlayEl = overlay;

  thumbWrap.appendChild(img);
  thumbWrap.appendChild(overlay);

  const info = document.createElement('div');
  info.className = 'img-card-info';

  const name = document.createElement('div');
  name.className = 'img-card-name';
  name.textContent = filename;
  name.title = filename;

  const status = document.createElement('div');
  status.className = 'img-card-status';
  status.textContent = 'Aguardando';
  entry.statusEl = status;

  info.appendChild(name);
  info.appendChild(status);

  const dlBtn = document.createElement('button');
  dlBtn.className = 'btn-card-dl';
  dlBtn.textContent = '↓ Download';
  dlBtn.addEventListener('click', () => downloadEntry(entry, filename));

  card.appendChild(thumbWrap);
  card.appendChild(info);
  card.appendChild(dlBtn);
  batchGrid.appendChild(card);

  entry.cardEl = card;
  return card;
}

/* ── Run queue ── */
btnRemove.addEventListener('click', async () => {
  if (isRunning || !queue.length) return;
  isRunning = true;
  btnRemove.disabled = true;
  btnDownloadAll.disabled = true;
  progressWrap.classList.add('visible');
  setStatus('');

  const total = queue.length;
  let done = 0;

  for (const entry of queue) {
    if (entry.resultDataUrl) { done++; continue; } // já processado

    setCardState(entry, 'active', 'Processando…');
    updateProgress(done, total, 'Processando lote…');

    try {
      const res  = await fetch('/api/removebg', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ imageBase64: entry.originalDataUrl })
      });
      const json = await res.json().catch(() => null);
      if (!res.ok) throw new Error(json?.message || `Erro ${res.status}`);

      entry.resultDataUrl  = json.base64;
      entry.thumbEl.src    = json.base64;
      setCardState(entry, 'done', 'Pronto ✓');
    } catch (err) {
      setCardState(entry, 'error', 'Erro: ' + err.message);
    }

    done++;
    updateProgress(done, total, done === total ? 'Lote concluído' : 'Processando lote…');
  }

  isRunning = false;
  setLoading(false);

  const allDone = queue.every(e => !!e.resultDataUrl);
  if (allDone) {
    btnDownloadAll.disabled = false;
    setStatus('Lote concluído — ' + queue.filter(e => e.resultDataUrl).length + ' imagens prontas ✓');
  } else {
    const errors = queue.filter(e => !e.resultDataUrl).length;
    setStatus(errors + ' imagem(ns) com erro. As demais estão prontas.', true);
    btnDownloadAll.disabled = queue.every(e => !e.resultDataUrl);
  }
});

/* ── Progress ── */
function updateProgress(done, total, label) {
  progressText.textContent  = label;
  progressCount.textContent = done + ' / ' + total;
  progressFill.style.width  = (total ? (done / total) * 100 : 0) + '%';
}

/* ── Card state ── */
function setCardState(entry, state, statusText) {
  entry.cardEl.className   = 'img-card ' + state;
  entry.statusEl.textContent = statusText;
}

/* ── Downloads ── */
function downloadEntry(entry, filename) {
  if (!entry.resultDataUrl) return;
  const base = filename.replace(/\.[^.]+$/, '');
  const a = document.createElement('a');
  a.download = base + '-sem-fundo.png';
  a.href     = entry.resultDataUrl;
  a.click();
}

btnDownloadAll.addEventListener('click', async () => {
  const ready = queue.filter(e => e.resultDataUrl);
  if (!ready.length) return;

  btnDownloadAll.disabled = true;
  setStatus('Preparando ZIP…');

  const zip = new JSZip();
  ready.forEach(entry => {
    const base   = entry.file.name.replace(/\.[^.]+$/, '');
    const b64    = entry.resultDataUrl.split(',')[1];
    zip.file(base + '-sem-fundo.png', b64, { base64: true });
  });

  const blob = await zip.generateAsync({ type: 'blob' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.download = 'sem-fundo-lote.zip';
  a.href     = url;
  a.click();
  URL.revokeObjectURL(url);

  btnDownloadAll.disabled = false;
  setStatus('ZIP baixado ✓');
  setTimeout(() => setStatus(''), 2500);
});

/* ── Reset ── */
btnReset.addEventListener('click', () => {
  queue       = [];
  isRunning   = false;
  photoFile.value = '';
  batchGrid.innerHTML = '';
  batchGrid.classList.remove('visible');
  uploadZone.style.display = '';
  btnRemove.disabled      = true;
  btnDownloadAll.disabled = true;
  btnReset.style.display  = 'none';
  progressWrap.classList.remove('visible');
  progressFill.style.width = '0%';
  setLoading(false);
  setStatus('');
});

function setStatus(msg, isError = false) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className   = 'status-msg' + (isError ? ' err' : '');
}

function setLoading(on) {
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
}
</script>
</body>
</html>
